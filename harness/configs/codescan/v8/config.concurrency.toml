# CodeScan-Artex (SCA) on SEC-bench Pro — V8 concurrency A (wave 1).
#
# Run from the repository root:
#   set -a; source ~/Projects/egrun/.secrets/env; set +a
#   .venv/bin/python harness/eval_codescan.py --no-tui \
#       harness/configs/codescan/v8/config.concurrency.toml
#
# Findings-only static audit: no PoC, no binary execution. The audit scope is
# the full V8 src tree (repo-relative to work_dir=/src/v8), overriding
# meta.json target_subdir so data flows can be closed through src/wasm,
# src/heap, src/builtins, etc.

model = "deepseek-flash[1m]"
provider = "anthropic"
outdir = "output/v8/codescan/concurrency_a"
project = "v8"

# Wave 1 (same instances as the ARTEX concurrency A wave 1).
instances = ["385775375", "443182220", "447307165", "390201806", "394635429"]

timeout = 5400
prompt_template = "../prompts/codescan/findings_only.j2"
images_dir = "../projects/v8"
source_entries = ["src"]

# SCA engine (host paths; ~ is expanded).
sca_bin = "~/Projects/egrun/codescan/artex"
codescan_skills = "~/Projects/egrun/codescan/codescan-skills.tgz"
port = 7878
worker_count = 2

# Never pull missing images implicitly; prefetch them explicitly.
pull_missing = false
# container_prefix = "codescan-eval"
